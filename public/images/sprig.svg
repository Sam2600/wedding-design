  <path class="leaf r" style="transform-origin:113.5px 37.0px;animation-delay:1.51s" d="M113.5 37.0Q117.5 27.2 111.8 18.2Q107.8 28.0 113.5 37.0ZM113.5 37.0L112.1 21.6"/>
  <path class="petal" style="animation-delay:1.85s" d="M139.0 11.5Q137.3 5.5 141.7 4.0Q144.1 8.0 139.0 11.5Z"/>
  <path class="petal" style="animation-delay:1.92s" d="M139.0 11.5Q144.2 8.1 147.0 11.8Q143.9 15.3 139.0 11.5Z"/>
  <path class="petal" style="animation-delay:1.99s" d="M139.0 11.5Q143.9 15.4 141.2 19.2Q136.9 17.3 139.0 11.5Z"/>
