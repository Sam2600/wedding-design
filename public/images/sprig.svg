<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 225">
  <!-- Line-art sprig that grows when shown: the stem draws in, the leaves unfurl from the stem,
       a flower opens at the tip. Its stem starts at (18, 216); the page and the QR poster pin
       that point to a corner (qr.js draws every path here, without the animation). -->
  <style>
    path { fill: none; stroke: #B8ADBE; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .stem { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(0.45, 0, 0.3, 1) 0.2s forwards; }
    .leaf, .petal, .centre { opacity: 0; animation: unfurl 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .leaf.l { transform: scale(0.15) rotate(-24deg); }
    .leaf.r { transform: scale(0.15) rotate(24deg); }
    .petal, .centre { transform-origin: 139.0px 11.5px; transform: scale(0.1) rotate(-40deg); }
    .centre { animation-delay: 2.20s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes unfurl { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .stem, .leaf, .petal, .centre { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
    }
  </style>
  <path class="stem" pathLength="1" d="M18 216C26 150 64 84 136 14"/>
  <path class="leaf l" style="transform-origin:24.2px 184.3px;animation-delay:0.44s" d="M24.2 184.3Q49.0 184.5 63.4 164.3Q38.6 164.1 24.2 184.3ZM24.2 184.3L56.3 167.9"/>
