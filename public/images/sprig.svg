  <path class="leaf r" style="transform-origin:51.8px 118.5px;animation-delay:0.92s" d="M51.8 118.5Q54.9 100.0 41.5 87.0Q38.5 105.4 51.8 118.5ZM51.8 118.5L43.3 92.6"/>
  <path class="leaf l" style="transform-origin:65.7px 96.3px;animation-delay:1.08s" d="M65.7 96.3Q81.4 101.9 95.0 92.2Q79.2 86.6 65.7 96.3ZM65.7 96.3L89.7 92.9"/>
  <path class="leaf r" style="transform-origin:80.3px 76.0px;animation-delay:1.23s" d="M80.3 76.0Q84.5 62.0 75.5 50.5Q71.2 64.5 80.3 76.0ZM80.3 76.0L76.4 55.1"/>
