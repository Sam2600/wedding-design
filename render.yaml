# Render Blueprint: the same static site as vercel.json, but on one address: here the memories page
# is /memories, not a subdomain. There is no build step; the repo root is published as-is because
# asset paths start with /public/.
services:
  - type: web
    name: mom-wedding-design
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /qr
        destination: /qr.html
      - type: rewrite
        source: /memories
        destination: /memories.html
      - type: rewrite
        source: /*
        destination: /invitation.html
    headers:
      - path: /public/mintzu-zwe-wedding.ics
        name: Content-Type
        value: "text/calendar; charset=utf-8"
